[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# a feature "tray-icon" liga o suporte ao ícone na bandeja do sistema (Fase 2c)
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Plugin de banco de dados SQLite (Fase 2a). A feature "sqlite" liga o suporte ao SQLite.
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Plugin de armazenamento de configurações em arquivo JSON (Fase 2b).
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

